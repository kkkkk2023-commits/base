<!-- templates/login.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Вход</title>
    <style>body{background:#000;color:#fff;text-align:center;padding-top:100px;}</style>
</head>
<body>
    <h2>🔒 Доступ к базе ответов</h2>
    <form method="POST" action="/login">
        Email: <input type="email" name="email" required><br><br>
        Пароль: <input type="password" name="password" required><br><br>
        <button type="submit">Войти</button>
    </form>
    <script>
        // Передаём данные устройства
        const url = new URL(window.location);
        url.searchParams.set('screen', screen.width + 'x' + screen.height);
        url.searchParams.set('platform', navigator.platform);
        history.replaceState(null, null, url);
    </script>
</body>
</html>