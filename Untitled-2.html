<!-- templates/dashboard.html -->
<!DOCTYPE html>
<html>

<head>
    <title>База ответов</title>
    <link rel="stylesheet" href="/static/style.css">
    <script>
        // Блокировка скриншотов (частично)
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.ctrlKey && (e.key === 'c' || e.key === 'u' || e.key === 's')) e.preventDefault();
            if (e.key === 'F12') e.preventDefault();
        });
    </script>
</head>

<body>
    <div id="watermark">
        Доступ: {{ email }}<br> Устройство: {{ email|replace('@', ' [at] ') }}
    </div>

    <div class="content">
        <h2>📚 Выберите тему</h2>
        {% for topic in topics %}
        <button onclick="loadTopic('{{ topic }}')">{{ topic }}</button> {% endfor %}

        <div id="questions"></div>
    </div>

    <script>
        function loadTopic(topic) {
            fetch('/get_questions?topic=' + encodeURIComponent(topic))
                .then(r => r.json())
                .then(data => {
                    let html = `<h3>${topic}</h3>`;
                    data.forEach(q => {
                        html += `<div class="question"><strong>❓ ${q.вопрос}</strong></div>`;
                        html += `<div class="answer">✅ ${q.ответ}</div><hr>`;
                    });
                    document.getElementById('questions').innerHTML = html;
                });
        }
    </script>
</body>

</html>
